spring.application.name=vetcare-facturacion

server.port=${PORT:8085}

spring.mongodb.uri=${VETCARE_MONGO_URI:mongodb://localhost:27017/vetcare_facturacion}
vetcare.indexes.enabled=true

vetcare.security.jwt.secret=${VETCARE_JWT_SECRET:vetcare-clave-de-desarrollo-cambiar-en-produccion-2026}

vetcare.pacientes.url=${VETCARE_PACIENTES_URL:http://localhost:8082}
vetcare.farmacia.url=${VETCARE_FARMACIA_URL:http://localhost:8084}
vetcare.downstream-timeout-ms=${VETCARE_DOWNSTREAM_TIMEOUT_MS:5000}

# IVA aplicado a productos. Los servicios no llevan IVA.
vetcare.billing.default-tax-rate=${VETCARE_DEFAULT_TAX_RATE:0.19}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=vetcare-facturacion
info.app.description=Tarifas, facturas, pagos y cartera - VetCare

logging.level.com.vetcare.facturacion=INFO
