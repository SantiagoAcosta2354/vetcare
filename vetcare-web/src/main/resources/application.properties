spring.application.name=vetcare-web

server.port=${PORT:8080}

# Direcciones de los microservicios. En Render se resuelven desde las variables
# del blueprint; en local apuntan a los puertos de desarrollo.
vetcare.services.usuarios=${VETCARE_USUARIOS_URL:http://localhost:8081}
vetcare.services.pacientes=${VETCARE_PACIENTES_URL:http://localhost:8082}
vetcare.services.clinica=${VETCARE_CLINICA_URL:http://localhost:8083}
vetcare.services.farmacia=${VETCARE_FARMACIA_URL:http://localhost:8084}
vetcare.services.facturacion=${VETCARE_FACTURACION_URL:http://localhost:8085}
vetcare.services.timeout-ms=${VETCARE_DOWNSTREAM_TIMEOUT_MS:8000}

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
server.error.whitelabel.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=vetcare-web
info.app.description=Capa de vista Thymeleaf - VetCare

logging.level.com.vetcare.web=INFO
