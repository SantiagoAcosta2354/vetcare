<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cita')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <a class="small text-decoration-none" th:href="@{/atencion}">← Volver a la lista</a>
    <h4 class="mt-2" th:text="${appointment.petName} + ' · ' + ${appointment.ownerName}">Luna</h4>
    <p class="text-muted" th:text="${appointment.date} + ' ' + ${appointment.startTime} + ' · ' + ${appointment.professionalName}">Fecha</p>

    <div class="card mb-3">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4"><span class="small-label">Motivo</span><div th:text="${appointment.reason}">Control</div></div>
                <div class="col-md-4"><span class="small-label">Especie</span><div th:text="${appointment.petSpecies}">CANINO</div></div>
                <div class="col-md-4"><span class="small-label">Estado de la cita</span><div th:text="${appointment.statusLabel}">Confirmada</div></div>
            </div>
        </div>
    </div>

    <div class="card" th:if="${record == null}">
        <div class="card-header bg-white fw-semibold">Abrir historia clinica</div>
        <div class="card-body">
            <form method="post" th:action="@{/atencion/{id}/abrir(id=${appointment.id})}" class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Motivo de la consulta</label>
                    <input class="form-control" name="reason" th:value="${appointment.reason}" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Abrir historia</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card" th:if="${record != null}">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <span class="small-label">Historia clinica</span>
                <div th:text="'Estado: ' + ${record.statusLabel}">Abierta</div>
            </div>
            <a class="btn btn-primary" th:href="@{/atencion/registro/{id}(id=${record.id})}">
                Continuar atencion
            </a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
