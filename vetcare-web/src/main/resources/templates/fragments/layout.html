<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · VetCare'">VetCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6f7f9; }
        .navbar-brand { font-weight: 600; letter-spacing: .3px; }
        .card { border: 0; box-shadow: 0 1px 3px rgba(16, 24, 40, .08); }
        .table > :not(caption) > * > * { padding: .6rem .75rem; }
        .badge-soft { background: #eef2ff; color: #3538cd; }
        .small-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: #667085; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background:#0f172a">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-heart-pulse"></i> VetCare
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" th:if="${currentUser != null and currentUser.hasRole('ADMIN')}">
                    <a class="nav-link" th:href="@{/tablero}"><i class="bi bi-speedometer2"></i> Tablero</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and (currentUser.hasRole('ADMIN') or currentUser.hasRole('RECEPCION'))}">
                    <a class="nav-link" th:href="@{/agenda}"><i class="bi bi-calendar-week"></i> Agenda</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and (currentUser.hasRole('ADMIN') or currentUser.hasRole('VETERINARIO'))}">
                    <a class="nav-link" th:href="@{/atencion}"><i class="bi bi-clipboard2-pulse"></i> Atencion</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and (currentUser.hasRole('ADMIN') or currentUser.hasRole('LABORATORIO'))}">
                    <a class="nav-link" th:href="@{/examenes}"><i class="bi bi-eyedropper"></i> Examenes</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and (currentUser.hasRole('ADMIN') or currentUser.hasRole('FARMACIA'))}">
                    <a class="nav-link" th:href="@{/farmacia}"><i class="bi bi-capsule"></i> Farmacia</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and (currentUser.hasRole('ADMIN') or currentUser.hasRole('RECEPCION'))}">
                    <a class="nav-link" th:href="@{/facturacion}"><i class="bi bi-receipt"></i> Facturacion</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.hasRole('ADMIN')}">
                    <a class="nav-link" th:href="@{/admin}"><i class="bi bi-people"></i> Usuarios</a>
                </li>
                <li class="nav-item" th:if="${currentUser != null and currentUser.hasRole('DUENO')}">
                    <a class="nav-link" th:href="@{/portal}"><i class="bi bi-house-heart"></i> Mis mascotas</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3" th:if="${currentUser != null}">
                <div class="text-white-50 small text-end">
                    <div class="text-white" th:text="${currentUser.fullName}">Usuario</div>
                    <div th:text="${#strings.listJoin(currentUser.roles, ' · ')}">ROL</div>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button class="btn btn-outline-light btn-sm" type="submit">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div class="alert alert-success alert-dismissible fade show" th:if="${ok}" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${ok}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-warning alert-dismissible fade show" th:if="${warning}" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${warning}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
