<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuarios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <h4 class="mb-3">Cuentas y roles</h4>

    <div class="card mb-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Nombre</th><th>Correo</th><th>Roles</th><th>Estado</th><th style="width:28%">Cambiar roles</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.fullName}">Nombre</td>
                    <td class="small text-muted" th:text="${u.email}">correo</td>
                    <td><span class="badge badge-soft" th:each="r : ${u.roles}" th:text="${r}" style="margin-right:4px">ROL</span></td>
                    <td>
                        <span class="badge" th:classappend="${u.active} ? ' bg-success' : ' bg-secondary'"
                              th:text="${u.active} ? 'Activa' : 'Inactiva'">Activa</span>
                    </td>
                    <td>
                        <form class="d-flex gap-1" method="post" th:action="@{/admin/{id}/roles(id=${u.id})}">
                            <select class="form-select form-select-sm" name="roles" multiple size="3">
                                <option value="ADMIN">ADMIN</option>
                                <option value="RECEPCION">RECEPCION</option>
                                <option value="VETERINARIO">VETERINARIO</option>
                                <option value="LABORATORIO">LABORATORIO</option>
                                <option value="FARMACIA">FARMACIA</option>
                                <option value="DUENO">DUENO</option>
                            </select>
                            <button class="btn btn-sm btn-outline-primary" type="submit">Guardar</button>
                        </form>
                        <form method="post" th:action="@{/admin/{id}/estado(id=${u.id})}" class="mt-1">
                            <input type="hidden" name="active" th:value="${!u.active}">
                            <button class="btn btn-sm btn-outline-secondary" type="submit"
                                    th:text="${u.active} ? 'Desactivar' : 'Activar'">Desactivar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-white fw-semibold">Nueva cuenta</div>
        <div class="card-body">
            <form class="row g-3" method="post" th:action="@{/admin}">
                <div class="col-md-4"><input class="form-control" name="fullName" placeholder="Nombre completo" required></div>
                <div class="col-md-4"><input class="form-control" name="email" type="email" placeholder="correo@vetcare.co" required></div>
                <div class="col-md-4"><input class="form-control" name="phone" placeholder="Telefono"></div>
                <div class="col-md-4"><input class="form-control" name="password" type="password" placeholder="Contrasena (8+ caracteres)" required></div>
                <div class="col-md-5">
                    <select class="form-select" name="roles" multiple size="4" required>
                        <option value="ADMIN">ADMIN</option>
                        <option value="RECEPCION">RECEPCION</option>
                        <option value="VETERINARIO">VETERINARIO</option>
                        <option value="LABORATORIO">LABORATORIO</option>
                        <option value="FARMACIA">FARMACIA</option>
                        <option value="DUENO">DUENO</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-start">
                    <button class="btn btn-primary" type="submit">Crear cuenta</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
