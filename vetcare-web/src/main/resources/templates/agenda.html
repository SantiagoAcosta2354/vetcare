<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Agenda')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Agenda</h4>
        <form class="d-flex gap-2" method="get" th:action="@{/agenda}">
            <input class="form-control form-control-sm" type="date" name="date" th:value="${date}">
            <button class="btn btn-sm btn-outline-secondary" type="submit">Ver dia</button>
        </form>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-white fw-semibold" th:text="'Citas del ' + ${date}">Citas</div>
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead>
                <tr><th>Hora</th><th>Paciente</th><th>Dueno</th><th>Profesional</th><th>Motivo</th><th>Estado</th><th style="width:30%">Accion</th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${appointments}">
                    <td th:text="${item.startTime} + ' - ' + ${item.endTime}">09:00</td>
                    <td>
                        <div th:text="${item.petName}">Luna</div>
                        <div class="small text-muted" th:text="${item.petSpecies}">CANINO</div>
                    </td>
                    <td th:text="${item.ownerName}">Ana</td>
                    <td th:text="${item.professionalName}">Dra.</td>
                    <td class="small" th:text="${item.reason}">Control</td>
                    <td><span class="badge badge-soft" th:text="${item.statusLabel}">Agendada</span></td>
                    <td>
                        <form class="d-flex gap-1" method="post" th:action="@{/agenda/{id}/status(id=${item.id})}">
                            <input type="hidden" name="date" th:value="${date}">
                            <select class="form-select form-select-sm" name="status">
                                <option value="CONFIRMADA">Confirmar</option>
                                <option value="EN_ATENCION">En atencion</option>
                                <option value="ATENDIDA">Atendida</option>
                                <option value="CANCELADA">Cancelar</option>
                                <option value="NO_ASISTIO">No asistio</option>
                            </select>
                            <input class="form-control form-control-sm" name="reason" placeholder="Motivo si cancela">
                            <button class="btn btn-sm btn-primary" type="submit">Aplicar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay citas para esta fecha</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-white fw-semibold">Agendar cita</div>
        <div class="card-body">
            <form method="post" th:action="@{/agenda}" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Dueno</label>
                    <select class="form-select" id="ownerId" name="ownerId" required>
                        <option value="">Seleccione...</option>
                        <option th:each="o : ${owners}" th:value="${o.id}"
                                th:text="${o.fullName} + ' · ' + ${o.document}">Ana</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Mascota</label>
                    <select class="form-select" id="petId" name="petId" required>
                        <option value="">Seleccione un dueno primero</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Sede</label>
                    <select class="form-select" name="clinicId" required>
                        <option th:each="c : ${clinics}" th:value="${c.id}" th:text="${c.name}">Sede</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Profesional</label>
                    <select class="form-select" name="professionalId" required>
                        <option th:each="p : ${professionals}" th:value="${p.id}" th:text="${p.fullName}">Dra.</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Fecha</label>
                    <input class="form-control" type="date" name="date" th:value="${date}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Hora</label>
                    <input class="form-control" type="time" name="startTime" step="1800" value="09:00" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Motivo</label>
                    <input class="form-control" name="reason" placeholder="Control, vacunacion, urgencia..." required>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Agendar</button>
                    <span class="small text-muted ms-2">Las citas empiezan en franjas de 30 minutos y no se cruzan con otra del mismo profesional.</span>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
    const ownerSelect = document.getElementById('ownerId');
    const petSelect = document.getElementById('petId');
    ownerSelect.addEventListener('change', async () => {
        petSelect.innerHTML = '<option value="">Cargando...</option>';
        if (!ownerSelect.value) {
            petSelect.innerHTML = '<option value="">Seleccione un dueno primero</option>';
            return;
        }
        const response = await fetch('/agenda/pets?ownerId=' + encodeURIComponent(ownerSelect.value));
        const pets = await response.json();
        petSelect.innerHTML = pets.length
            ? pets.map(p => `<option value="${p.id}">${p.name} · ${p.species}</option>`).join('')
            : '<option value="">El dueno no tiene mascotas registradas</option>';
    });
</script>
</body>
</html>
