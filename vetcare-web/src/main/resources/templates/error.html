<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('No se pudo completar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container py-5">
    <div class="card p-4">
        <h4 class="mb-2"><i class="bi bi-exclamation-octagon text-danger"></i> No se pudo completar la operacion</h4>
        <p class="text-muted mb-1" th:text="${message}">Mensaje del servicio</p>
        <p class="small text-muted" th:if="${status}" th:text="'Codigo ' + ${status}"></p>
        <div class="mt-3">
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Volver</a>
            <a class="btn btn-primary" th:href="@{/}">Ir al inicio</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
