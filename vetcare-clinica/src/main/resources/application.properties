spring.application.name=vetcare-clinica

server.port=${PORT:8083}

spring.mongodb.uri=${VETCARE_MONGO_URI:mongodb://localhost:27017/vetcare_clinica}
vetcare.indexes.enabled=true

vetcare.security.jwt.secret=${VETCARE_JWT_SECRET:vetcare-clave-de-desarrollo-cambiar-en-produccion-2026}

# Servicios con los que se comunica
vetcare.pacientes.url=${VETCARE_PACIENTES_URL:http://localhost:8082}
vetcare.farmacia.url=${VETCARE_FARMACIA_URL:http://localhost:8084}
vetcare.downstream-timeout-ms=${VETCARE_DOWNSTREAM_TIMEOUT_MS:5000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=vetcare-clinica
info.app.description=Historia clinica, formulas, examenes y vacunacion - VetCare

logging.level.com.vetcare.clinica=INFO
