spring.application.name=vetcare-farmacia

server.port=${PORT:8084}

spring.mongodb.uri=${VETCARE_MONGO_URI:mongodb://localhost:27017/vetcare_farmacia}
vetcare.indexes.enabled=true

# Solo valida la firma del token; no emite tokens
vetcare.security.jwt.secret=${VETCARE_JWT_SECRET:vetcare-clave-de-desarrollo-cambiar-en-produccion-2026}

# Servicios con los que se comunica
vetcare.clinica.url=${VETCARE_CLINICA_URL:http://localhost:8083}
vetcare.downstream-timeout-ms=${VETCARE_DOWNSTREAM_TIMEOUT_MS:5000}

# Dias de anticipacion para la alerta de vencimiento
vetcare.inventory.expiry-alert-days=${VETCARE_EXPIRY_ALERT_DAYS:30}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=vetcare-farmacia
info.app.description=Medicamentos, lotes y despachos - VetCare

logging.level.com.vetcare.farmacia=INFO
