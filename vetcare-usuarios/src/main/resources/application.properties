spring.application.name=vetcare-usuarios

# --- Servidor ---
# En Render el puerto llega en la variable PORT; en local se usa 8081.
server.port=${PORT:8081}

# --- MongoDB (base propia de este microservicio) ---
spring.mongodb.uri=${VETCARE_MONGO_URI:mongodb://localhost:27017/vetcare_usuarios}
vetcare.indexes.enabled=true

# --- Emision y validacion de tokens ---
# Este es el unico servicio que firma tokens; los otros cinco solo validan la
# firma con el mismo secreto. Minimo 32 caracteres.
vetcare.security.jwt.secret=${VETCARE_JWT_SECRET:vetcare-clave-de-desarrollo-cambiar-en-produccion-2026}
vetcare.security.jwt.issuer=vetcare-usuarios
vetcare.security.jwt.expiration-minutes=${VETCARE_JWT_EXPIRATION_MINUTES:480}

# Cuentas de demostracion: se crean solo si el correo no existe.
vetcare.seed.enabled=${VETCARE_SEED_ENABLED:true}
vetcare.seed.admin-email=${VETCARE_ADMIN_EMAIL:admin@vetcare.co}
vetcare.seed.admin-password=${VETCARE_ADMIN_PASSWORD:Admin1234*}
vetcare.seed.demo-password=${VETCARE_DEMO_PASSWORD:Demo1234*}

# --- Documentacion de la API ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- Observabilidad ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=vetcare-usuarios
info.app.description=Microservicio de cuentas, roles y autenticacion - VetCare

logging.level.com.vetcare.usuarios=INFO
