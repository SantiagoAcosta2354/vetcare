spring.application.name=vetcare-pacientes

server.port=${PORT:8082}

# Base propia del servicio (database-per-service)
spring.mongodb.uri=${VETCARE_MONGO_URI:mongodb://localhost:27017/vetcare_pacientes}
vetcare.indexes.enabled=true

# Secreto compartido: este servicio solo valida la firma, no emite tokens
vetcare.security.jwt.secret=${VETCARE_JWT_SECRET:vetcare-clave-de-desarrollo-cambiar-en-produccion-2026}
vetcare.security.jwt.issuer=vetcare-usuarios

# Agenda
vetcare.agenda.slot-minutes=30
vetcare.agenda.opening-time=08:00
vetcare.agenda.closing-time=18:00

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.name=vetcare-pacientes
info.app.description=Duenos, mascotas, sedes y agenda - VetCare

logging.level.com.vetcare.pacientes=INFO
