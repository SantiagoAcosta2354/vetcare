# render.yaml
# Despliegue de VetCare en Render: seis servicios web en un proyecto nuevo,
# cada uno construido desde su propio Dockerfile dentro del monorepo.
#
# Decisiones que conviene entender antes de tocar el archivo:
#
# 1. No hay credenciales escritas aqui. La cadena de MongoDB se pide al crear el
#    Blueprint (sync: false) y el secreto JWT lo genera Render UNA sola vez en
#    vetcare-usuarios; los demas lo copian con fromService. Si cada servicio
#    generara su propio secreto, la firma no coincidiria y todo responderia 401.
#
# 2. Las URLs entre servicios se resuelven con RENDER_EXTERNAL_URL del servicio
#    de destino: en el plan gratuito no hay red privada y Render puede anadir un
#    sufijo al subdominio.
#
# 3. vetcare-web no recibe el secreto: no emite ni valida tokens, solo reenvia el
#    que obtuvo al iniciar sesion contra vetcare-usuarios.
#
# 4. Los tiempos de espera se suben por encima del valor de desarrollo porque un
#    servicio gratuito suspendido tarda alrededor de un minuto en despertar.

projects:
  - name: vetcare
    environments:
      - name: produccion
        services:
          # ---------------------------------------------------------- usuarios
          - type: web
            name: vetcare-usuarios
            runtime: docker
            plan: free
            rootDir: vetcare-usuarios
            healthCheckPath: /actuator/health
            envVars:
              - key: VETCARE_MONGO_URI
                sync: false
              - key: VETCARE_JWT_SECRET
                generateValue: true
              - key: VETCARE_ADMIN_EMAIL
                value: admin@vetcare.co
              - key: VETCARE_ADMIN_PASSWORD
                sync: false

          # --------------------------------------------------------- pacientes
          - type: web
            name: vetcare-pacientes
            runtime: docker
            plan: free
            rootDir: vetcare-pacientes
            healthCheckPath: /actuator/health
            envVars:
              - key: VETCARE_MONGO_URI
                sync: false
              - key: VETCARE_JWT_SECRET
                fromService:
                  type: web
                  name: vetcare-usuarios
                  envVarKey: VETCARE_JWT_SECRET

          # ----------------------------------------------------------- clinica
          - type: web
            name: vetcare-clinica
            runtime: docker
            plan: free
            rootDir: vetcare-clinica
            healthCheckPath: /actuator/health
            envVars:
              - key: VETCARE_MONGO_URI
                sync: false
              - key: VETCARE_JWT_SECRET
                fromService:
                  type: web
                  name: vetcare-usuarios
                  envVarKey: VETCARE_JWT_SECRET
              - key: VETCARE_PACIENTES_URL
                fromService:
                  type: web
                  name: vetcare-pacientes
                  envVarKey: RENDER_EXTERNAL_URL
              - key: VETCARE_FARMACIA_URL
                fromService:
                  type: web
                  name: vetcare-farmacia
                  envVarKey: RENDER_EXTERNAL_URL

          # ---------------------------------------------------------- farmacia
          - type: web
            name: vetcare-farmacia
            runtime: docker
            plan: free
            rootDir: vetcare-farmacia
            healthCheckPath: /actuator/health
            envVars:
              - key: VETCARE_MONGO_URI
                sync: false
              - key: VETCARE_JWT_SECRET
                fromService:
                  type: web
                  name: vetcare-usuarios
                  envVarKey: VETCARE_JWT_SECRET
              - key: VETCARE_CLINICA_URL
                fromService:
                  type: web
                  name: vetcare-clinica
                  envVarKey: RENDER_EXTERNAL_URL

          # ------------------------------------------------------- facturacion
          - type: web
            name: vetcare-facturacion
            runtime: docker
            plan: free
            rootDir: vetcare-facturacion
            healthCheckPath: /actuator/health
            envVars:
              - key: VETCARE_MONGO_URI
                sync: false
              - key: VETCARE_JWT_SECRET
                fromService:
                  type: web
                  name: vetcare-usuarios
                  envVarKey: VETCARE_JWT_SECRET
              - key: VETCARE_PACIENTES_URL
                fromService:
                  type: web
                  name: vetcare-pacientes
                  envVarKey: RENDER_EXTERNAL_URL

          # --------------------------------------------------------------- web
          - type: web
            name: vetcare-web
            runtime: docker
            plan: free
            rootDir: vetcare-web
            healthCheckPath: /actuator/health
            envVars:
              - key: VETCARE_USUARIOS_URL
                fromService:
                  type: web
                  name: vetcare-usuarios
                  envVarKey: RENDER_EXTERNAL_URL
              - key: VETCARE_PACIENTES_URL
                fromService:
                  type: web
                  name: vetcare-pacientes
                  envVarKey: RENDER_EXTERNAL_URL
              - key: VETCARE_CLINICA_URL
                fromService:
                  type: web
                  name: vetcare-clinica
                  envVarKey: RENDER_EXTERNAL_URL
              - key: VETCARE_FARMACIA_URL
                fromService:
                  type: web
                  name: vetcare-farmacia
                  envVarKey: RENDER_EXTERNAL_URL
              - key: VETCARE_FACTURACION_URL
                fromService:
                  type: web
                  name: vetcare-facturacion
                  envVarKey: RENDER_EXTERNAL_URL
